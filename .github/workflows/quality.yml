name: Quality gates
on:
  workflow_call:
    inputs:
      bundle:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    name: Logic, integration and security
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - if: inputs.bundle
        run: python3 qa/unpack-site.py
      - name: Unit, integration, engine and artifact checks
        run: npm test
      - name: HTTP routes, media range and WASM delivery
        run: npm run test:http
      - name: Authored source and workflow security
        run: npm run test:security
      - name: Dependency advisories
        run: npm audit --audit-level=high --json > qa/results/dependency-audit.json
      - name: Retain core evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-results
          path: qa/results/
          retention-days: 14
  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - if: inputs.bundle
        run: python3 qa/unpack-site.py
      - name: Install test browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Scenarios and regression checks
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Retain browser reports, traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.browser }}
          path: qa/results/browser*
          retention-days: 14
  performance:
    name: Lighthouse / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - if: inputs.bundle
        run: python3 qa/unpack-site.py
      - run: npx playwright install chromium
      - name: Three-run medians and performance budgets
        env:
          PERF_PROFILE: ${{ matrix.profile }}
        run: CHROME_PATH=$(node -p "require('playwright').chromium.executablePath()") npm run test:performance
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.profile }}
          path: qa/results/lighthouse/
          retention-days: 14
  passed:
    name: All quality gates
    if: always()
    needs: [core, browser, performance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every test job to pass
        env:
          CORE: ${{ needs.core.result }}
          BROWSER: ${{ needs.browser.result }}
          PERFORMANCE: ${{ needs.performance.result }}
        run: |
          printf 'Core: %s\nBrowsers: %s\nPerformance: %s\n' "$CORE" "$BROWSER" "$PERFORMANCE" >> "$GITHUB_STEP_SUMMARY"
          test "$CORE" = success && test "$BROWSER" = success && test "$PERFORMANCE" = success
